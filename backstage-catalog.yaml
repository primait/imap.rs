apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: imap_session
  description: A wrapper around async_imap offering a simpler way to deal with common IMAP operations.
  tags:
    - rust
    - imap
    - email
  annotations:
    backstage.io/source-location: url:https://github.com/primait/imap.rs/tree/master/imap_session/
  links:
    - url: https://crates.io/crates/imap_session
      title: crates.io
    - url: https://docs.rs/imap_session
      title: docs.rs
      icon: docs
spec:
  type: library
  lifecycle: production
  owner: group:default/team-policy-operations-spain
