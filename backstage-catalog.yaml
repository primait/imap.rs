apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: deadpool_imap
  description: A deadpool implementation for IMAP connections, using imap_session as a backend.
  tags:
    - rust
    - imap
    - email
    - connection-pool
  annotations:
    backstage.io/source-location: url:https://github.com/primait/imap.rs/tree/master/deadpool_imap/
  links:
    - url: https://crates.io/crates/deadpool_imap
      title: crates.io
    - url: https://docs.rs/deadpool_imap
      title: docs.rs
      icon: docs
spec:
  type: library
  lifecycle: production
  owner: group:default/team-policy-operations-spain
  system: prima.it
  dependsOn:
    - component:default/imap_session
